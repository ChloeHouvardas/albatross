name: radar

on:
  schedule:
    - cron: "17 * * * *"   # hourly; GitHub often delays or drops scheduled runs, so hourly keeps us inside the 2h target
  workflow_dispatch:
    inputs:
      test_alert:
        description: "Send one test message to every channel + phone"
        type: boolean
        default: false
      flood:
        description: "Post every currently open role + listing to #dump (doesn't change seen roles)"
        type: boolean
        default: false
      chain:
        description: "Internal: keep the hourly self-scheduling loop going"
        type: boolean
        default: false

permissions:
  contents: write
  actions: write

jobs:
  run:
    runs-on: ubuntu-latest
    concurrency:
      group: radar
      cancel-in-progress: false
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Run radar
        env:
          DISCORD_COMPANY: ${{ secrets.DISCORD_COMPANY }}
          DISCORD_REPO_FEED: ${{ secrets.DISCORD_REPO_FEED }}
          DISCORD_HEALTH: ${{ secrets.DISCORD_HEALTH }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          DISCORD_DUMP: ${{ secrets.DISCORD_DUMP }}
          DISCORD_TORONTO: ${{ secrets.ALBATROSS_TORONTO }}
        run: python main.py ${{ inputs.test_alert && '--test-alert' || '' }} ${{ inputs.flood && '--flood' || '' }}
      - name: Save seen roles
        if: ${{ !inputs.test_alert && !inputs.flood }}
        run: |
          git config user.name "intern-radar"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          git diff --cached --quiet && exit 0
          git commit -q -m "radar: update seen roles [skip ci]"
          for i in 1 2 3; do git pull -q --rebase && git push -q && exit 0; sleep 5; done
          exit 1

  # GitHub's cron never fires for this repo, so the loop re-dispatches itself: wait ~1h, then start
  # the next run (GITHUB_TOKEN may trigger workflow_dispatch). Separate job so manual runs aren't blocked.
  next:
    needs: run
    if: ${{ always() && inputs.chain }}
    runs-on: ubuntu-latest
    timeout-minutes: 70
    concurrency:
      group: radar-chain
      cancel-in-progress: false
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sleep 3300
          gh workflow run radar -R ${{ github.repository }} -f chain=true
